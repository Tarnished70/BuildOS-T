env: # Environment variables to pass to all tasks
    CIRRUS_CLONE_DEPTH: 1 # No need to clone with the whole history
    CIRRUS_WORKING_DIR: "/tmp" # Where to clone the aosp-builder repo

# store our secrets here
    my_og_token: "ENCRYPTED[!69e5f5eb05bcde4b07cd6c1fd6f5513664d7e98c279275e32335809786ffc600e7b8d0d34ca5ed19621d73675179f066!]" # main id
    REAL_REPO_OWNER: "ENCRYPTED[!2d216e11d390b24637945eead7a7daa9d3ae3cb0907ae24c3763a05f725187ac5836f88fb3e6e71a180eea6f440ac023!]" # main id

task:
    name: kernel
    timeout_in: 120m
    container:
      image: nexgang/ubuntu:latest
      cpu: 8
      memory: 32G
      greedy: true
    run_script:
      - git clone --depth=1 https://$REAL_REPO_OWNER:$my_og_token@github.com/ImSpiDy/kernel_xiaomi_lavender-4.19 /tmp/kernel -b scar
      - cd /tmp/kernel
      - bash build.sh --KSU --RDP
      - bash build.sh --KSU --HEVC
      - bash build.sh --KSU --Legacy
