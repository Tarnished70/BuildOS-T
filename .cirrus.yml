env:
    # OrangeFox Sync Repository
    FOX_SYNC: https://gitlab.com/OrangeFox/sync.git

    # Config
    CONFIG: config.sh

    # Cirrus Specific Vars (Do *NOT* Change)
    CIRRUS_SHELL: bash

    # Depth clone
    CIRRUS_CLONE_DEPTH: 1 # No need to clone with the whole history

# store our secrets here
    my_og_token: "ENCRYPTED[0276990e26d93085fb08a543241e40cf2b8034b53b6b8b3061c72dbfeb337ebc9457b3343a5c69be82f0f9cb3f48c0b5]" # main id

    bot_api: "ENCRYPTED[e09e9a0cc5e18746d2e09f1e0e3d23c5093407c11489831f87d4fea889b3e5e6b44d95bd27bc85a3caecd26c50080a54]"
    TG_TOKEN: "$bot_api"

    chat_id: "-1001510035003"
    TG_CHAT_ID: "$chat_id"

    USE_RBE: false

task:
  name: "R"
  timeout_in: 120m
  container:
      image: nexgang/ubuntu:latest
      cpu: 8
      memory: 32G
      greedy: true

  Checks_script:
      - bash scripts/che*

  Sync_script:
