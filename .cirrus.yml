task:
    name: kernel
    timeout_in: 120m
    container:
      image: nexgang/ubuntu:latest
      cpu: 8
      memory: 32G
      greedy: true
    run_script:
      - git clone --depth=1 https://github.com/garnet-random/android_kernel_xiaomi_sm7435-modules /tmp/kernel/xiaomi/sm7435-modules
